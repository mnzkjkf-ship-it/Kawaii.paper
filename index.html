<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Wallpaper Studio - 500 ลายไม่ซ้ำ (Fluffpuffy Spring)</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf8f5;
            --card-bg: #ffffff;
            --primary: #e8a598;
            --secondary: #f4d06f;
            --accent: #88c999;
            --text-main: #6b5b53;
            --text-sub: #9e8c82;
            --border: #f0e1d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1p', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff0f3, #fffbe9, #f0fdf4);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(232, 165, 152, 0.15);
            border: 2px dashed #f6d2cc;
        }

        header h1 {
            font-size: 28px;
            color: #d9776c;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(232, 165, 152, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 165, 152, 0.6);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: #7a5c1e;
            box-shadow: 0 4px 15px rgba(244, 208, 111, 0.4);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .wallpaper-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border: 2px solid var(--border);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .wallpaper-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: #eee;
            cursor: pointer;
            overflow: hidden;
        }

        .preview-container canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            backdrop-filter: blur(4px);
        }

        .card-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .card-sub {
            font-size: 11px;
            color: var(--text-sub);
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-btn {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .card-btn:hover {
            background: #75b385;
        }

        .card-btn.downloaded {
            background: #a3c1ad;
        }

        .load-more {
            text-align: center;
            margin: 40px 0;
        }

        /* Modal Preview */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-canvas-wrap {
            width: 240px;
            height: 480px;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .modal-canvas-wrap canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-close {
            background: #e0e0e0;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌻 Kawaii Wallpaper Studio</h1>
            <p>Fluffpuffy Spring Edition · 500 ลายไม่ซ้ำ (ไร้ข้อความ 100%) ✨</p>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="randomBatchDownload()">🎁 สุ่มดาวน์โหลดชุด 5 รูป HD</button>
                <button class="btn" onclick="loadAllWallpapers()">🌻 แสดงครบทั้ง 500 รูป</button>
            </div>
        </header>

        <div class="filters">
            <button class="filter-btn active" onclick="filterCategory('all', this)">ทั้งหมด (500)</button>
            <button class="filter-btn" onclick="filterCategory('sunflower', this)">🌻 ทุ่งทานตะวัน</button>
            <button class="filter-btn" onclick="filterCategory('tulip', this)">🌷 สวนทิวลิป</button>
            <button class="filter-btn" onclick="filterCategory('sky', this)">☁️ ท้องฟ้าละมุน</button>
            <button class="filter-btn" onclick="filterCategory('night', this)">🌙 พระจันทร์ดาว</button>
        </div>

        <div class="gallery-grid" id="wallpaperGrid"></div>

        <div class="load-more">
            <button class="btn" id="loadMoreBtn" onclick="loadMoreWallpapers()">โหลดเพิ่มอีก (+24 รูป)</button>
        </div>
    </div>

    <!-- Modal Preview -->
    <div class="modal" id="previewModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="modalTitle" style="margin-bottom: 12px; color: var(--text-main);">ตัวอย่างวอลเปเปอร์</h3>
            <div class="modal-canvas-wrap">
                <canvas id="modalCanvas" width="1290" height="2796"></canvas>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="card-btn" id="modalDownloadBtn" style="padding: 12px; font-size: 14px;">📥 ดาวน์โหลดภาพขนาดจริง (HD)</button>
                <button class="modal-close" onclick="closeModalDirect()">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        const totalWallpapers = 500;
        let displayedCount = 24;
        let currentFilter = 'all';

        const characters = ['น้องหมีน้อย', 'กระต่ายน้อย', 'คิตตี้โบว์', 'เป็ดน้อยดุ๊กดิ๊ก', 'น้องหมาพุดเดิ้ล', 'แมวหลับบนเมฆ', 'คู่หูหมี&เป็ด', 'พระจันทร์ยิ้ม'];
        const styles = ['ทุ่งดอกไม้เต็มจอ', 'ตารางเบนโตะสปริง', 'กรอบโพลารอยด์ละมุน', 'แอบโผล่ขอบล่าง', 'หน้าต่างดอกไม้', 'วงแหวนฟลอรัล', 'ละอองดาวระยิบระยับ', 'สวนเลมอนพาสเทล'];
        const categories = ['sunflower', 'tulip', 'sky', 'night'];

        // ฟังก์ชันวาดภาพวอลเปเปอร์ลงบน Canvas (ไร้ข้อความ 100%)
        function drawWallpaper(canvas, index) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Seed generator จาก index
            const seed = (index * 9301 + 49297) % 233280;
            const rnd = seed / 233280;

            // เลือกโทนสีพื้นหลัง
            const palId = index % 5;
            let bgColors = [
                ['#fff5e6', '#ffe4c4', '#ffdab9'], // ช็อกโกแลต/ครีม
                ['#fff0f3', '#ffd1dc', '#ffb6c1'], // ชมพูพาสเทล
                ['#f0f8ff', '#e0ffff', '#b0e0e6'], // ฟ้าเบบี้บลู
                ['#f5f0ff', '#e6e6fa', '#d8bfd8'], // ม่วงลาเวนเดอร์
                ['#f0fff0', '#e0eee0', '#c1ffc1']  // เขียวมัทฉะ
            ][palId];

            // วาดพื้นหลัง Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, bgColors[0]);
            grad.addColorStop(0.5, bgColors[1]);
            grad.addColorStop(1, bgColors[2]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // วาดลวดลายพื้นหลัง (Pattern / Meadow)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 25; i++) {
                let cx = (Math.sin(i * index + seed) * 0.5 + 0.5) * w;
                let cy = (Math.cos(i * 123 + index) * 0.5 + 0.5) * h;
                let cr = 20 + (i % 5) * 15;
                ctx.beginPath();
                ctx.arc(cx, cy, cr, 0, Math.PI * 2);
                ctx.fill();
            }

            // วาดทุ่งดอกไม้ / องค์ประกอบธรรมชาติ
            const catType = index % 4;
            if (catType === 0) {
                // ทุ่งทานตะวัน
                ctx.fillStyle = '#f4d06f';
                for (let i = 0; i < 12; i++) {
                    let fx = (i / 11) * w;
                    let fy = h - 250 + (i % 3) * 60;
                    drawSunflower(ctx, fx, fy, 70);
                }
            } else if (catType === 1) {
                // สวนทิวลิป
                const tulipColors = ['#e8a598', '#ff9eaa', '#d4a5a5', '#f3c68f'];
                for (let i = 0; i < 14; i++) {
                    let tx = (i / 13) * w;
                    let ty = h - 220 + (i % 4) * 50;
                    drawTulip(ctx, tx, ty, tulipColors[i % tulipColors.length]);
                }
            } else if (catType === 2) {
                // ก้อนเมฆ & ท้องฟ้า
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                drawCloud(ctx, w * 0.2, h * 0.25, 140);
                drawCloud(ctx, w * 0.75, h * 0.4, 110);
            } else {
                // พระจันทร์และดวงดาว
                ctx.fillStyle = '#fceade';
                ctx.beginPath();
                ctx.arc(w * 0.5, h * 0.28, 120, 0, Math.PI * 2);
                ctx.fill();
                // ดาวระยิบ
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 8; i++) {
                    let sx = w * (0.2 + (i * 0.09));
                    let sy = h * (0.15 + (i % 3) * 0.12);
                    drawStar(ctx, sx, sy, 22);
                }
            }

            // วาดตัวละครหลักตรงกลาง
            let charX = w * 0.5;
            let charY = h * 0.55;
            drawCuteCharacter(ctx, charX, charY, index % 8);
        }

        function drawSunflower(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#d49b38';
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.ellipse(0, -size * 0.4, size * 0.2, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#5c3a21';
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawTulip(ctx, x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = '#88c999';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-15, 80, 0, 150);
            ctx.stroke();

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, -30, 32, 45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawCloud(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.5, 0, Math.PI * 2);
            ctx.arc(-size * 0.4, size * 0.2, size * 0.35, 0, Math.PI * 2);
            ctx.arc(size * 0.4, size * 0.2, size * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawStar(ctx, x, y, r) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.MFi && Math.cos((i * 4 * Math.PI) / 5) * r, Math.sin((i * 4 * Math.PI) / 5) * r);
            }
            ctx.closePath();
            ctx.fillStyle = '#fffae6';
            ctx.fill();
            ctx.restore();
        }

        function drawCuteCharacter(ctx, x, y, type) {
            ctx.save();
            ctx.translate(x, y);
            // หัวหอม/หมีน้อยพาสเทล
            ctx.fillStyle = '#f0c2a8';
            ctx.beginPath();
            ctx.arc(0, 0, 110, 0, Math.PI * 2);
            ctx.fill();

            // หู
            ctx.beginPath();
            ctx.arc(-75, -75, 42, 0, Math.PI * 2);
            ctx.arc(75, -75, 42, 0, Math.PI * 2);
            ctx.fill();

            // แก้มป่อง
            ctx.fillStyle = '#fca1a1';
            ctx.beginPath();
            ctx.arc(-55, 15, 22, 0, Math.PI * 2);
            ctx.arc(55, 15, 22, 0, Math.PI * 2);
            ctx
